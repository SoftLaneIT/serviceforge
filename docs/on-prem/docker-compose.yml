# ServiceForge Platform — Docker Compose (On-Prem / Single Node)
# Usage:
#   Full platform:      docker compose up -d
#   Core only:          docker compose --profile core up -d
#   With monitoring:    docker compose --profile monitoring up -d
#   Dev mode (hot):     docker compose -f docker-compose.yml -f docker-compose.dev.yml up

x-common-env: &common-env
  SF_DATABASE_URL: postgres://serviceforge:${POSTGRES_PASSWORD}@postgres:5432/serviceforge?sslmode=disable
  SF_REDIS_URL: redis://redis:6379/0
  SF_KAFKA_BROKERS: kafka:9092
  SF_ENVIRONMENT: ${SF_ENVIRONMENT:-production}
  SF_LOG_LEVEL: ${SF_LOG_LEVEL:-info}
  SF_LOG_FORMAT: json

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - serviceforge
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:

  # ─────────────────────────────────────────────────
  #  INFRASTRUCTURE
  # ─────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: serviceforge
      POSTGRES_USER: serviceforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - serviceforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceforge -d serviceforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  redis:
    image: redis:7-alpine
    container_name: sf-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - serviceforge
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  kafka:
    image: bitnami/kafka:3.7
    container_name: sf-kafka
    restart: unless-stopped
    environment:
      # KRaft mode (no Zookeeper needed)
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic defaults
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 6
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/bitnami/kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - serviceforge
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ─────────────────────────────────────────────────
  #  REVERSE PROXY
  # ─────────────────────────────────────────────────

  traefik:
    image: traefik:v3.1
    container_name: sf-proxy
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=serviceforge"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/docker/traefik/certs:/certs:ro
    networks:
      - serviceforge

  # ─────────────────────────────────────────────────
  #  APPLICATION SERVICES
  # ─────────────────────────────────────────────────

  gateway:
    <<: *service-defaults
    image: serviceforge/gateway:${SF_VERSION:-latest}
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: sf-gateway
    environment:
      <<: *common-env
      SF_SERVICE_NAME: gateway
      SF_GATEWAY_PORT: 8000
      # Internal service URLs
      SF_BOOKING_URL: http://booking:8001
      SF_PAYMENT_URL: http://payment:8002
      SF_QUEUE_URL: http://queue:8003
      SF_NOTIFICATION_URL: http://notification:8004
      SF_LOGGING_URL: http://logging:8005
      SF_CONFIG_ENGINE_URL: http://config-engine:8006
      SF_TENANT_URL: http://tenant:8007
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

  tenant:
    <<: *service-defaults
    image: serviceforge/tenant:${SF_VERSION:-latest}
    build:
      context: .
      dockerfile: services/tenant/Dockerfile
    container_name: sf-tenant
    environment:
      <<: *common-env
      SF_SERVICE_NAME: tenant
      SF_TENANT_PORT: 8007

  config-engine:
    <<: *service-defaults
    image: serviceforge/config-engine:${SF_VERSION:-latest}
    build:
      context: .
      dockerfile: services/config-engine/Dockerfile
    container_name: sf-config-engine
    environment:
      <<: *common-env
      SF_SERVICE_NAME: config-engine
      SF_CONFIG_ENGINE_PORT: 8006

  booking:
    <<: *service-defaults
    image: serviceforge/booking:${SF_VERSION:-latest}
    build:
      context: .
      dockerfile: services/booking/Dockerfile
    container_name: sf-booking
    profiles: ["", "core", "full"]
    environment:
      <<: *common-env
      SF_SERVICE_NAME: booking
      SF_BOOKING_PORT: 8001

  payment:
    <<: *service-defaults
    image: serviceforge/payment:${SF_VERSION:-latest}
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: sf-payment
    profiles: ["", "full"]
    environment:
      <<: *common-env
      SF_SERVICE_NAME: payment
      SF_PAYMENT_PORT: 8002

  queue:
    <<: *service-defaults
    image: serviceforge/queue:${SF_VERSION:-latest}
    build:
      context: .
      dockerfile: services/queue/Dockerfile
    container_name: sf-queue
    profiles: ["", "full"]
    environment:
      <<: *common-env
      SF_SERVICE_NAME: queue
      SF_QUEUE_PORT: 8003

  notification:
    <<: *service-defaults
    image: serviceforge/notification:${SF_VERSION:-latest}
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: sf-notification
    profiles: ["", "full"]
    environment:
      <<: *common-env
      SF_SERVICE_NAME: notification
      SF_NOTIFICATION_PORT: 8004

  logging:
    <<: *service-defaults
    image: serviceforge/logging:${SF_VERSION:-latest}
    build:
      context: .
      dockerfile: services/logging/Dockerfile
    container_name: sf-logging
    profiles: ["", "full"]
    environment:
      <<: *common-env
      SF_SERVICE_NAME: logging
      SF_LOGGING_PORT: 8005

  # ─────────────────────────────────────────────────
  #  MANAGEMENT UI
  # ─────────────────────────────────────────────────

  web:
    <<: *service-defaults
    image: serviceforge/web:${SF_VERSION:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sf-web
    depends_on:
      - gateway
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost/api}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost/ws}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512M

  # ─────────────────────────────────────────────────
  #  DATABASE MIGRATIONS (run once)
  # ─────────────────────────────────────────────────

  migrate:
    image: serviceforge/migrate:${SF_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrate
    container_name: sf-migrate
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - serviceforge
    restart: "no"

  # ─────────────────────────────────────────────────
  #  MONITORING (optional, activate with --profile monitoring)
  # ─────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sf-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./deploy/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - serviceforge

  grafana:
    image: grafana/grafana:11.0.0
    container_name: sf-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - serviceforge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  loki:
    image: grafana/loki:3.0.0
    container_name: sf-loki
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - serviceforge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  serviceforge:
    name: serviceforge
    driver: bridge
